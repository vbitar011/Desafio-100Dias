# H2 em Memória simulando MySQL
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Desativar Flyway e deixar o Hibernate gerir as tabelas no teste
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Segredos Fictícios
api.security.token.secret=chave_secreta_jwt_para_testes_minimo_256_bits_32_caracteres
app.cors.allowed-origins=http://localhost:3000

# Variáveis do Inicializador para evitar falhas no load do contexto
app.admin.email=admin@test.com
app.admin.senha=senhaAdmin123

spring.config.import=