#Credenciais do Banco de Dados
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
api.security.token.secret=${API_SECURITY_TOKEN_SECRET}
# Bootstrap ADMIN
app.admin.email=${APP_ADMIN_EMAIL}
app.admin.senha=${APP_ADMIN_PASSWORD}

# Perfis e JPA
spring.profiles.active=${APP_PROFILE:dev}
spring.jpa.hibernate.ddl-auto=validate

# Flyway Baseline (Necessário pois o DB já existe)
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

#Mostrar as queries SQL no console do IntelliJ (útil para debug)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true