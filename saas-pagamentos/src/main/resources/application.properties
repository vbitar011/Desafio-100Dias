#Perfis e Importação de Variáveis
spring.profiles.active=${APP_PROFILE:dev}
spring.config.import=optional:file:.env[.properties]

#Conexão
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

#JPA & Hibernate (Validate em vez de Update)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

#Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

#Segurança e CORS
api.security.token.secret=${API_SECURITY_TOKEN_SECRET}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

#Bootstrap Admin
app.admin.email=${APP_ADMIN_EMAIL:#{null}}
app.admin.senha=${APP_ADMIN_PASSWORD:#{null}}